<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>健身打卡</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4ade80;
    --accent-soft: rgba(74, 222, 128, 0.12);
    --text: #e8eaed;
    --muted: #8b8f98;
    --done: #4b5563;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .app { width: 100%; max-width: 480px; }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  h1 { font-size: 20px; font-weight: 700; }
  select {
    background: var(--card);
    color: var(--text);
    border: 1px solid #2a2e37;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .banner {
    background: var(--card);
    border-radius: 14px;
    padding: 40px 20px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
  }
  .banner.rest { color: var(--muted); }
  .banner.finish { color: var(--accent); }
  .progress {
    height: 8px;
    background: #2a2e37;
    border-radius: 999px;
    overflow: hidden;
    margin: 12px 0 20px;
  }
  .progress > i {
    display: block;
    height: 100%;
    background: var(--accent);
    width: 0;
    transition: width .25s ease;
  }
  .task {
    background: var(--card);
    border: 1px solid transparent;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    transition: transform .08s ease, border-color .2s ease;
  }
  .task:active { transform: scale(0.98); }
  .task.current { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .task.done { opacity: 0.55; }
  .task.done .label { text-decoration: line-through; color: var(--done); }
  .check {
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid #3a3f4b;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: var(--bg);
  }
  .task.done .check { background: var(--accent); border-color: var(--accent); }
  .label { font-size: 16px; line-height: 1.4; }
  .label small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .task.done .label small { color: var(--done); }
  .hint {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 15px;
    color: var(--accent);
  }
  .hint span { display:block; color: var(--muted); font-size:12px; margin-top:4px; }
  .reset {
    margin-top: 18px;
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: 1px solid #2a2e37;
    border-radius: 10px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .err { color:#f87171; font-size:14px; line-height:1.6; }
  code { background:#000; padding:2px 6px; border-radius:4px; font-size:12px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>健身打卡</h1>
    <select id="dateSel"></select>
  </header>
  <div class="sub" id="subtitle"></div>
  <div id="content"></div>
</div>

<script>
const STORAGE_PREFIX = "gym-checkin-";
let PLAN = null;

function todayStr() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function loadDone(date) {
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_PREFIX + date) || "[]")); }
  catch { return new Set(); }
}
function saveDone(date, set) {
  localStorage.setItem(STORAGE_PREFIX + date, JSON.stringify([...set]));
}

// 把一天的训练展开成“每组一条”的任务列表
function buildTasks(day) {
  const tasks = [];
  day.exercises.forEach((ex, ei) => {
    const sets = parseInt(ex.sets, 10) || 1;
    for (let s = 1; s <= sets; s++) {
      tasks.push({
        id: `${day.date}__${ei}__${s}`,
        text: `${ex.name}，${ex.weight}，${ex.reps}次，第${s}组，组间休息${ex.rest}`,
        exercise: ex.name
      });
    }
  });
  return tasks;
}

function render(date) {
  const content = document.getElementById("content");
  const sub = document.getElementById("subtitle");
  content.innerHTML = "";

  if (!PLAN) {
    content.innerHTML = `<div class="err">计划文件 (plan.json) 加载失败。<br>
      请确保通过本地服务器或 GitHub Pages 打开本页面，而不是直接双击用 <code>file://</code> 打开。</div>`;
    return;
  }

  const day = (PLAN.days || []).find(d => d.date === date);
  sub.textContent = PLAN.title || "";

  if (!day) {
    content.innerHTML = `<div class="banner">今日无训练计划</div>`;
    return;
  }

  if (day.type === "rest") {
    content.innerHTML = `<div class="banner rest">今日休息</div>`;
    return;
  }

  const tasks = buildTasks(day);
  const done = loadDone(date);
  const total = tasks.length;
  const finished = tasks.filter(t => done.has(t.id)).length;
  const allDone = finished === total;
  const current = tasks.find(t => !done.has(t.id));

  // 进度条
  const prog = document.createElement("div");
  prog.className = "progress";
  prog.innerHTML = `<i style="width:${(finished / total) * 100}%"></i>`;
  content.appendChild(prog);

  // 当前任务提示
  if (allDone) {
    const b = document.createElement("div");
    b.className = "banner finish";
    b.textContent = "今日训练结束";
    content.appendChild(b);
  } else if (current) {
    const h = document.createElement("div");
    h.className = "hint";
    h.innerHTML = `下一项：${current.exercise}<span>${current.text}</span>`;
    content.appendChild(h);
  }

  // 任务列表（按顺序，未完成的在前方便点击）
  const ordered = allDone ? tasks : [current, ...tasks.filter(t => t !== current)];
  ordered.forEach(t => {
    const el = document.createElement("div");
    el.className = "task" + (done.has(t.id) ? " done" : "") + (t === current ? " current" : "");
    el.innerHTML = `<div class="check">${done.has(t.id) ? "✓" : ""}</div>
                    <div class="label">${t.text}</div>`;
    el.onclick = () => {
      const d = loadDone(date);
      if (d.has(t.id)) d.delete(t.id); else d.add(t.id);
      saveDone(date, d);
      render(date);
    };
    content.appendChild(el);
  });

  // 重置按钮
  const btn = document.createElement("button");
  btn.className = "reset";
  btn.textContent = "重置今日打卡";
  btn.onclick = () => { saveDone(date, new Set()); render(date); };
  content.appendChild(btn);
}

function init() {
  const sel = document.getElementById("dateSel");
  fetch("plan.json")
    .then(r => r.json())
    .then(data => {
      PLAN = data;
      const dates = (PLAN.days || []).map(d => d.date).sort();
      sel.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join("");
      const today = todayStr();
      sel.value = dates.includes(today) ? today : dates[0];
      render(sel.value);
    })
    .catch(() => render(""));

  sel.onchange = () => render(sel.value);
}

init();
</script>
</body>
</html>
